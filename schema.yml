components:
  schemas:
    CheckDeviceGLPIRequestRequest:
      type: object
      description: Request serializer для проверки устройства в GLPI.
      properties:
        force:
          type: boolean
          default: false
          description: Принудительная проверка (игнорировать кэш)
    CheckDeviceGLPIResponse:
      type: object
      properties:
        sync:
          $ref: '#/components/schemas/GLPISync'
        ok:
          type: boolean
      required:
      - ok
      - sync
    CheckMultipleDevicesGLPIRequestRequest:
      type: object
      description: Request serializer для массовой проверки устройств в GLPI.
      properties:
        device_ids:
          type: array
          items:
            type: integer
          description: Список ID устройств (максимум 100)
          maxItems: 100
          minItems: 1
      required:
      - device_ids
    CheckMultipleDevicesGLPIResponse:
      type: object
      properties:
        ok:
          type: boolean
        stats:
          type: object
          additionalProperties: {}
      required:
      - ok
      - stats
    CreateOkdeskIssueRequestRequest:
      type: object
      description: Request serializer для создания заявки в Okdesk.
      properties:
        device_id:
          type: integer
          description: ID устройства
        cartridge:
          type: string
          nullable: true
          description: Картридж (опционально)
        service_type:
          type: string
          nullable: true
          default: Обслуживание
          description: Тип обслуживания
        comment:
          type: string
          nullable: true
          description: Комментарий (опционально)
        phone:
          type: string
          nullable: true
          description: Телефон (опционально)
      required:
      - device_id
    CreateOkdeskIssueResponse:
      type: object
      properties:
        ok:
          type: boolean
        issue_id:
          type: integer
      required:
      - issue_id
      - ok
    DeleteMonthRequestRequest:
      type: object
      description: Request serializer для удаления месяца.
      properties:
        year:
          type: integer
          maximum: 2100
          minimum: 2020
          description: Год
        month:
          type: integer
          maximum: 12
          minimum: 1
          description: Месяц (1-12)
      required:
      - month
      - year
    DeleteMonthResult:
      type: object
      properties:
        success:
          type: boolean
          description: Успешность операции
        error:
          type: string
          nullable: true
          description: Текст ошибки
        message:
          type: string
          nullable: true
          description: Сообщение
        deleted_count:
          type: integer
          nullable: true
          description: Количество удалённых записей
        bulk_log_id:
          type: integer
          nullable: true
          description: ID лога массовой операции
      required:
      - success
    Error:
      type: object
      description: Базовый сериализатор ошибок (текстовый).
      properties:
        detail:
          type: string
      required:
      - detail
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Тип ошибки
        message:
          type: string
          description: Сообщение
      required:
      - error
      - message
    GLPIExportStartRequestRequest:
      type: object
      description: Request serializer для запуска выгрузки в GLPI.
      properties:
        month:
          type: string
          nullable: true
          description: Месяц в формате YYYY-MM (опционально, по умолчанию текущий)
    GLPIExportStartResponse:
      type: object
      properties:
        ok:
          type: boolean
          description: Успешность операции
        task_id:
          type: string
          nullable: true
          description: ID задачи Celery
        message:
          type: string
          nullable: true
          description: Сообщение
        error:
          type: string
          nullable: true
          description: Текст ошибки
      required:
      - ok
    GLPISync:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        status_display:
          type: string
        glpi_ids:
          type: array
          items:
            type: integer
          nullable: true
        glpi_count:
          type: integer
          nullable: true
        is_synced:
          type: boolean
        has_conflict:
          type: boolean
        glpi_state_id:
          type: integer
          nullable: true
        glpi_state_name:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        checked_at:
          type: string
        checked_by:
          type: string
          nullable: true
      required:
      - checked_at
      - checked_by
      - error_message
      - glpi_count
      - glpi_ids
      - glpi_state_id
      - glpi_state_name
      - has_conflict
      - id
      - is_synced
      - status
      - status_display
    GroupUpdateResponse:
      type: object
      description: Ответ при успешном обновлении группы.
      properties:
        group:
          $ref: '#/components/schemas/ReportGroup'
        changed:
          type: array
          items:
            type: string
      required:
      - changed
      - group
    ItemUpdateResponse:
      type: object
      description: Ответ при успешном обновлении элемента.
      properties:
        item:
          $ref: '#/components/schemas/ReportGroupItem'
        changed:
          type: array
          items:
            type: string
      required:
      - changed
      - item
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
          description: Успешность операции
        error:
          type: string
          nullable: true
          description: Текст ошибки
      required:
      - ok
    OkdeskCommentInResponse:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        author:
          type: string
          nullable: true
        created_at:
          type: string
        is_public:
          type: boolean
      required:
      - author
      - content
      - created_at
      - id
      - is_public
    OkdeskPostCommentResponse:
      type: object
      properties:
        ok:
          type: boolean
        comment:
          $ref: '#/components/schemas/OkdeskCommentInResponse'
      required:
      - comment
      - ok
